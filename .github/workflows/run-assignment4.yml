# Executes the Assignment 4 notebook and saves cell outputs.
name: Execute Assignment 4 Notebook

on:
  push:
    paths:
      - ".github/workflows/run-assignment4.yml"
      - "Assignment_4_Machine_Learning.ipynb"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  execute-notebook:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install packages
        run: python -m pip install --upgrade pip pandas numpy matplotlib seaborn scikit-learn nbformat nbconvert ipykernel
      - name: Execute notebook and save outputs
        run: jupyter nbconvert --to notebook --execute --inplace Assignment_4_Machine_Learning.ipynb --ExecutePreprocessor.timeout=300
      - name: Commit notebook outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Assignment_4_Machine_Learning.ipynb
          if ! git diff --cached --quiet; then
            git commit -m "Save executed outputs for Assignment 4"
            git push
          fi
